<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Ares Energy Solar CRM - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ares Energy Solar CRM login portal">
    <meta name="author" content="Ares Energy">

    <!-- Favicon -->
    <link rel="shortcut icon" href="dreams-assets/assets/img/favicon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="dreams-assets/assets/css/bootstrap.min.css">

    <!-- Tabler Icon CSS -->
    <link rel="stylesheet" href="dreams-assets/assets/plugins/tabler-icons/tabler-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="dreams-assets/assets/css/style.css" id="app-style">

    <style>
        .auth-logo img {
            max-height: 80px;
            object-fit: contain;
        }
        .account-bg-01 {
            background-image: url('dreams-assets/assets/img/authentication/login-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="account-page bg-white">

    <!-- Begin Wrapper -->
    <div class="main-wrapper">
        <div class="overflow-hidden p-3 acc-vh">
            <!-- start row -->
            <div class="row vh-100 w-100 g-0"> 
                <!-- Left panel containing form -->
                <div class="col-lg-6 vh-100 overflow-y-auto overflow-x-hidden">
                    <div class="row h-100">
                        <div class="col-md-10 mx-auto d-flex flex-column justify-content-between">
                            <form id="loginForm" onsubmit="doLogin(event)" class="vh-100 d-flex justify-content-between flex-column p-4 pb-0">
                                <div class="text-center mb-4 auth-logo mt-3">
                                    <img src="averion_logo.jpg" class="img-fluid" alt="Ares Energy Logo">
                                </div>
                                <div>
                                    <div class="mb-4">
                                        <h3 class="mb-2">Sign In</h3>
                                        <p class="mb-0">Access the Solar CRM panel using your email and passcode.</p>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">User Name <span class="text-danger">*</span></label>
                                        <div class="input-group input-group-flat">
                                            <input type="text" id="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                                            <span class="input-group-text">
                                                <i class="ti ti-user"></i>
                                            </span>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Password <span class="text-danger">*</span></label>
                                        <div class="input-group input-group-flat pass-group">
                                            <input type="password" id="password" class="form-control pass-input" placeholder="Enter your password" autocomplete="current-password" required>
                                            <span class="input-group-text toggle-password" style="cursor: pointer;" onclick="togglePasswordDisplay()">
                                                <i class="ti ti-eye-off" id="togglePasswordIcon"></i>
                                            </span>
                                        </div>
                                    </div>

                                    <!-- Error Alert container -->
                                    <div class="alert alert-danger mb-3" role="alert" id="errorMsg" style="display: none;"></div>

                                    <div class="d-flex align-items-center justify-content-between mb-4">
                                        <div class="form-check form-check-md d-flex align-items-center">
                                            <input class="form-check-input mt-0" type="checkbox" id="rememberMe">
                                            <label class="form-check-label text-dark ms-1" for="rememberMe">
                                                Remember Me
                                            </label>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">Sign In</button>
                                    </div>
                                </div>
                                <div class="text-center pb-4 mt-auto">
                                    <p class="text-dark mb-0">Copyright &copy; <script>document.write(new Date().getFullYear())</script> - Ares Energy Solar CRM</p>
                                </div>
                            </form>
                        </div> <!-- end col -->
                    </div>
                </div>

                <!-- Right panel containing background -->
                <div class="col-lg-6 account-bg-01 d-none d-lg-block"></div> 
            </div>
            <!-- end row -->
        </div>
    </div>
    <!-- End Wrapper -->

    <!-- jQuery -->
    <script src="dreams-assets/assets/js/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap Core JS -->
    <script src="dreams-assets/assets/js/bootstrap.bundle.min.js"></script>    

    <!-- Main JS -->
    <script src="dreams-assets/assets/js/script.js"></script>

    <!-- Page Logic JS -->
    <script>
        // Pre-fill username if saved in local storage
        document.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('solar_crm_remembered_username');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('rememberMe').checked = true;
            }
        });

        async function doLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn      = document.getElementById('loginBtn');
            const errDiv   = document.getElementById('errorMsg');

            errDiv.style.display = 'none';

            if (!username || !password) {
                errDiv.innerText = '⚠️ Both username and password are required.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled    = true;
            btn.innerHTML   = '<span class="spinner"></span> Logging in...';

            // Handle Remember Me
            if (rememberMe) {
                localStorage.setItem('solar_crm_remembered_username', username);
            } else {
                localStorage.removeItem('solar_crm_remembered_username');
            }

            try {
                const res  = await fetch('/login', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    btn.innerHTML = 'Success!';
                    window.location.href = '/home.html'; // Redirect to Home
                } else {
                    errDiv.innerText = '❌ ' + (data.error || 'Login failed.');
                    errDiv.style.display = 'block';
                    btn.disabled  = false;
                    btn.innerHTML = 'Sign In';
                }
            } catch (e) {
                errDiv.innerText = '❌ Unable to connect to the server. Is the server running?';
                errDiv.style.display = 'block';
                btn.disabled  = false;
                btn.innerHTML = 'Sign In';
            }
        }

        function togglePasswordDisplay() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'ti ti-eye';
            } else {
                pwd.type = 'password';
                icon.className = 'ti ti-eye-off';
            }
        }
    </script>
</body>
</html>
